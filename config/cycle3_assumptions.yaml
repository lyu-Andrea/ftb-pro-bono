# Cycle 3 scenario model: Layer 0 assumptions.
# Every forward-looking number lives here. Changing a scenario never requires a code change.
# Units: rates and their changes are in PERCENTAGE POINTS (e.g. 0.5 = +0.5 pts); counts are people.
# Status of each assumption: [data] = measured, [published] = from a cited source,
# [team] = team proposal for FTB to confirm, [FTB] = FTB's decision.

base_year: 2024                 # [data] latest MMG year (MMG 2026 release). The anchor for every scenario.
target_years: [2025, 2026, 2027, 2028]

# Layer 1: sensitivities, read from the technical brief that matches the base year.
coefficients:                   # [published] MMG 2026 Technical Brief, Appendix Table 1 (state level, 2009-2024)
  unemployment: 0.471           # +1 pt unemployment -> +0.471 pt food insecurity
  poverty: 0.289                # +1 pt poverty -> +0.289 pt food insecurity
  source: "Feeding America, Map the Meal Gap 2026 Technical Brief, Appendix Table 1 (full population)"

# Unemployment: "observed" = BLS LAUS county annual averages for years already published (the current
# year is estimated as last year's annual + this year's year-to-date change vs. the same months last year).
# Years after the last BLS year stay at that level, plus the scenario's extra.
unemployment_history: data/external/bls/laus_m03.json     # [data]

# Population: UF BEBR county estimates (2020 census, 2025, 2026) and 2030 projections, interpolated by year.
population:
  estimates: data/external/bebr/Estimates_2026_Table1.xlsx  # [data]
  projections: data/external/bebr/projections_2026.xlsx     # [data]

# Layer 3: conversion.
meals_per_fi_person: from_mmg   # [published] county Annual Meal Gap / FI persons in the base year (~190 FTB-wide)
lbs_per_meal: 1.2               # [published] Feeding America convention (meals = lbs / 1.2 in NetSuite)
coverage:                       # share of the meal gap FTB supplies
  mode: ftb_wide_current        # [team] ftb_wide_current | by_county_current | fixed
  fixed_value: null             # [FTB] e.g. 0.50 when mode = fixed
  # "current" = local-service pounds in the last 4 complete quarters / baseline need (lbs) in the same period.
  distribution: data/processed/distribution_county_quarter.parquet
  pounds_column: pounds_local   # excludes disaster, food-bank transfers and hub agencies

# Quarterly split of annual pounds (FTB-wide seasonal shares, 2018-2025 without 2020).
seasonal_shares: data/processed/seasonal_quarter_shares.parquet
seasonal_scope: FTB             # FTB | county

# S (the area-wide shift) = food-price part + policy part.
#   food-price part [data]: b_food x % change in the relative price of food at home (CPI food at home / all items)
#     vs. the base year. Observed national CPI up to the latest month; after that the scenario's assumption.
#   policy part [team]: benefit / policy changes outside the price history (e.g. 2025-26 SNAP work requirements).
s_model:
  food_price_coef: 0.299        # [data] pts of S per +1% relative food price; refit with scripts/cycle3_s_model.py
  aid_effect_reference: 2.27    # [data] pts: size of the 2020-21 pandemic-aid effect (start / end), for scale
  cpi_files: [data/external/bls/national_2008_2017.json, data/external/bls/national_2018_2026.json]

# Scenarios. Each one is applied to every target year, relative to the base year.
#   unemployment_extra: pts ADDED on top of the observed BLS path (applies from the first year after BLS data)
#   poverty_change:     pts vs. base year (no newer poverty data exists than the base year's ACS)
#   food_price_change_pct_per_year: relative food price change per year AFTER the latest CPI year (%)
#   policy_shift:       pts of S from policy/benefits (the part history can't price)
#   population_series:  BEBR low | medium | high
scenarios:
  baseline:
    description: "Unemployment and food prices as observed through 2026, then flat; SNAP cuts add a modest shift"
    unemployment_extra: 0.0     # [team]
    poverty_change: 0.0         # [team]
    food_price_change_pct_per_year: 0.0   # [team]
    policy_shift: 0.5           # [team] 2025-26 SNAP work-requirement changes (FL caseload -489K, Jan 2025 -> Feb 2026);
                                #        about 1/5 of the pandemic-aid effect (aid_effect_reference)
    population_series: medium   # [published]
  economic_stress:
    description: "Recession on top of the observed path: +1.5 pts unemployment, +1 pt poverty, food inflation, larger SNAP effect"
    unemployment_extra: 1.5     # [team]
    poverty_change: 1.0         # [team]
    food_price_change_pct_per_year: 2.0   # [team]
    policy_shift: 1.0           # [team]
    population_series: medium
  historical_swing:
    description: "2022 replay: a benefit withdrawal the size of the end of pandemic aid, plus 2022-style food inflation"
    unemployment_extra: 0.0
    poverty_change: 0.0
    food_price_change_pct_per_year: 3.0   # [data] relative food price rose ~3% in 2022
    policy_shift: 2.3           # [data] = aid_effect_reference (S model); 2022 total: +0.9 food + 2.3 aid = +3.2 of +3.9
    population_series: medium

# Reference for choosing S: MMG year fixed effects (national level shift vs. 2009, pts), Appendix Table 1.
common_shift_history:           # [published]
  2010: -2.3
  2011: -1.9
  2012: -2.2
  2013: -1.8
  2014: -1.9
  2015: -3.0
  2016: -3.1
  2017: -2.9
  2018: -3.2
  2019: -3.5
  2020: -4.4
  2021: -5.0
  2022: -1.1
  2023: -0.1
  2024: -0.3

# Service-area access (E2SFCA): pounds per food-insecure person reachable from each tract.
access:
  centroids: data/external/census/2020_gaz_tracts_12.txt   # [data] Census 2020 Gazetteer, Florida tracts (get_public_data.sh)
  radii_miles: [5, 10, 15]      # [team] sensitivity radii
  main_radius_miles: 10         # [team] catchment used for flags
  low_access_ratio: 0.5         # [team] "low access" = below 50% of the FTB-wide average

# Layer 4: hurricane overlay (off by default). extra = planned lbs x footprint share x (uplift - 1) x weeks / 52
hurricane:
  enabled: false                # [FTB]
  counties: []                  # [FTB] county FIPS in the footprint, e.g. ["12057", "12103"]
  footprint_share: 0.3          # [FTB] share of each listed county's need affected
  uplift: 2.0                   # [published] FTB ran at ~2x normal daily meals in the 2024 storm response
  weeks: 4                      # [FTB]
